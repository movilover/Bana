name: Deploy Firebase security rules

# Publishes firestore.rules, storage.rules and firestore.indexes.json to Firebase (works on the free Spark plan).
# Needs ONE repository secret: FIREBASE_SERVICE_ACCOUNT (the service-account JSON). Without it this workflow does nothing.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - firestore.indexes.json
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy rules + indexes
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret not set - skipping rules deployment."
            exit 0
          fi
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project bana-a5770 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
