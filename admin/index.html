<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%234f46e5%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2738%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27%3EA%3C/text%3E%3C/svg%3E" />
    <title>BANA Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-neutral-950 antialiased selection:bg-indigo-600 selection:text-white dark:bg-neutral-950 dark:text-neutral-50">
    <div id="root"></div>
    <div id="boot-msg" style="font-family:system-ui,sans-serif;font-size:13px;color:#737373;padding:24px;text-align:center">Loading BANA Admin Console…</div>
    <script>
      // Shows a visible message instead of a blank page if the app bundle fails to load.
      (function () {
        function fail(text) {
          var el = document.getElementById('boot-msg');
          if (el) { el.style.color = '#e11d48'; el.textContent = text; }
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT') {
            fail('App files could not be loaded (' + (t.src || 'script') + '). The site must be deployed from the built "dist" output (GitHub Actions), not the raw source files.');
          }
        }, true);
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.children.length) fail('The admin app did not start. Check that GitHub Pages Source is set to "GitHub Actions" and the latest deploy succeeded.');
        }, 8000);
      })();
    </script>
    <noscript>The BANA Admin Console needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
