services:
  - type: web
    name: bana-realtime-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FIREBASE_PROJECT_ID
        value: bana-a5770
      - key: SUPER_ADMIN_EMAILS
        value: omor.faruk.sojol.2@gmail.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: LIVEKIT_WS_URL
        sync: false
      - key: LIVEKIT_HTTP_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: bana-media
      - key: MEDIA_BROKER_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@bana.app
      - key: APPROVED_PAID_PROVIDERS
        value: ""
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: HMS_ACCESS_KEY
        sync: false
      - key: HMS_APP_SECRET
        sync: false
      - key: HMS_TEMPLATE_ID
        sync: false
